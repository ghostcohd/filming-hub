    --shadow: 0 1px 2px rgba(40, 34, 18, .06), 0 10px 28px -14px rgba(40, 34, 18, .22);
    --shadow-sm: 0 1px 2px rgba(40, 34, 18, .07), 0 4px 12px -8px rgba(40, 34, 18, .2);
    --r: 14px;
    --head: 'Jost', system-ui, sans-serif;
    --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--stone-1) 0%, var(--stone-2) 70%) fixed;
    background-color: var(--stone-2);
    color: var(--ink);
    font: 15px/1.55 var(--body);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--gold); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  .top { padding: 20px 0 14px; }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    background: var(--yellow); color: var(--ink); border-radius: 9px; padding: 6px 10px;
    font: 700 14px/1 var(--head); letter-spacing: .04em; box-shadow: var(--shadow-sm);
  }
  .mark i { font-style: normal; font-weight: 500; opacity: .55; }
  .brand h1 { margin: 0; font: 600 22px/1.1 var(--head); letter-spacing: -.01em; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag {
    font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--gold); background: var(--yellow-soft); border-radius: 999px; padding: 5px 8px; white-space: nowrap;
  }
  .linkbtn { background: none; border: 0; padding: 6px 4px; min-height: 40px; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--ink); }

  /* ---------- Week bar + tabs ---------- */
  .bar { position: sticky; top: 0; z-index: 5; padding: 10px 0; background: linear-gradient(180deg, rgba(236,235,230,.96), rgba(240,239,235,.92)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
  .weekpick { display: flex; align-items: center; gap: 6px; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel);
    display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-sm); font-size: 18px; line-height: 1; color: var(--ink-2);
  }
  .iconbtn:hover { border-color: var(--gold); color: var(--ink); }
  .selectwrap { position: relative; }
  .selectwrap select {
    appearance: none; -webkit-appearance: none; height: 40px; padding: 0 36px 0 14px; border-radius: 10px;
    border: 1px solid var(--line-2); background: var(--panel); box-shadow: var(--shadow-sm);
    font: 600 16px/1 var(--head); cursor: pointer; min-width: 196px;
  }
  .selectwrap::after { content: ''; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .weekmeta { font: 400 11.5px/1.3 var(--mono); color: var(--muted); margin-left: 6px; }
  .weekmeta b { color: var(--gold); font-weight: 500; }
  .tabs { display: inline-flex; background: rgba(30,28,23,.06); border-radius: 12px; padding: 4px; gap: 2px; }
  .tabs button {
    border: 0; background: none; padding: 8px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-2); min-height: 36px;
  }
  .tabs button[aria-selected="true"] { background: var(--yellow); color: var(--ink); box-shadow: var(--shadow-sm); }

  main { padding: 22px 0 64px; }

  /* ---------- Shared bits ---------- */
  .panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,.6); }
  .label { font: 500 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  .muted { color: var(--muted); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
    border-radius: 10px; border: 1px solid transparent; background: var(--yellow); color: var(--ink);
    font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .btn:hover { filter: brightness(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: transparent; border-color: var(--line-2); box-shadow: none; color: var(--ink); }
  .btn.ghost:hover { border-color: var(--gold); background: var(--yellow-wash); }
  .btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .btn.danger { background: transparent; border-color: rgba(162,59,30,.35); color: var(--red); box-shadow: none; }
  .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); line-height: 1.35;
  }
  .chip.fmt { background: var(--yellow-soft); border-color: transparent; color: var(--gold); font-weight: 600; }
  .chip.trend b { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .chip.warn { background: #FBE9E2; border-color: transparent; color: var(--red); }
  .chip.ok { background: var(--yellow-soft); border-color: transparent; color: var(--gold); }
  .empty { padding: 44px 24px; text-align: center; }
  .empty h2 { font: 600 20px/1.3 var(--head); margin: 0 0 6px; }
  .empty p { margin: 0 auto; max-width: 440px; color: var(--muted); }
  .notice { padding: 12px 16px; border-radius: 12px; background: var(--yellow-wash); border: 1px solid rgba(138,98,0,.18); color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }

  /* ---------- Scripts ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .filters button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 500; min-height: 36px; }
  .filters button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); font-weight: 600; }
  .filters button small { font: 500 11px/1 var(--mono); color: var(--muted); margin-left: 4px; }
  .day { margin-bottom: 30px; }
  .dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 2px 12px; }
  .dayhead h2 { margin: 0; font: 600 21px/1.2 var(--head); }
  .dayhead .label { color: var(--muted); }
  .dayhead-chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  .script { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .script .toprow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .script .presenters i { font-style: normal; color: var(--muted); }
  .script .presenters .me { color: var(--ink); }
  .script h3 { margin: 0; font: 600 19px/1.3 var(--head); letter-spacing: -.005em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .script .preview {
    margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.5; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .readbtn {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 0;
    background: none; border: 0; cursor: pointer; text-align: left; font: 700 14px/1 var(--body); color: var(--ink);
  }
  .readbtn:hover { color: var(--gold); }
  .readbtn .sum-label { flex: 1; }
  .readbtn .sum-count { font-weight: 500; color: var(--muted); }
  .readbtn::after {
    content: ''; width: 7px; height: 7px; border-right: 2px solid var(--gold); border-top: 2px solid var(--gold);
    transform: rotate(45deg); flex: none; margin-right: 4px;
  }

  /* script pop-out */
  dialog.pop {
    width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 0; border-radius: 18px;
    background: var(--panel); color: var(--ink); box-shadow: 0 24px 80px rgba(20,18,12,.28); overflow: hidden;
  }
  dialog.pop[open] { display: flex; flex-direction: column; animation: popin .16s ease-out; }
  dialog.pop::backdrop { background: rgba(20,18,12,.45); }
  @keyframes popin { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  .pop-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
  .pop-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .pop-head h3 { margin: 0; font: 600 21px/1.3 var(--head); letter-spacing: -.015em; }
  .pop-head .presenters { font-size: 13px; }
  .pop-head .presenters i { font-style: normal; color: var(--muted); }
  .pop-close {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel);
    cursor: pointer; font-size: 22px; line-height: 1; color: var(--ink-2);
  }
  .pop-close:hover { border-color: var(--gold); color: var(--ink); }
  .pop-body { padding: 18px 22px; overflow-y: auto; overscroll-behavior: contain; }
  .pop-body .lines { margin-top: 0; }
  .pop-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
  body.popping { overflow: hidden; }
  @media (max-width: 640px) {
    dialog.pop { width: 100vw; max-width: 100vw; max-height: 92vh; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
    .pop-foot { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
    .pop-head, .pop-body, .pop-foot { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { dialog.pop[open] { animation: none; } }
  .lines { margin: 6px 0 0; border-left: 3px solid var(--yellow); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 10px; }
  .lines p { margin: 0; font-size: 15.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .lines .spk { display: block; font: 500 10.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
  .lines .mine .spk { color: var(--gold); }
  .lines .other { color: var(--ink-2); }
  .caption { margin-top: 14px; background: var(--panel-2); border-radius: 10px; padding: 12px 14px; }
  .caption .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .caption p { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
  .copy { border: 0; background: none; cursor: pointer; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); padding: 6px 2px; }
  .script .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }

  /* ---------- Calendar ---------- */
  .weektools { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .weeknote.removed { border-color: rgba(162,59,30,.25); background: #FBEFEA; }
  .weeknote { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .calhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .l-free::before { background: var(--panel); border: 1px dashed var(--line-2); }
  .legend .l-mine::before { background: var(--yellow); }
  .legend .l-taken::before { background: #E3E0D6; }
  .bookas { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
  .bookas select { height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 10px; font-weight: 600; }
  .cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .cday { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .cday.today { outline: 2px solid var(--yellow); outline-offset: -2px; }
  .cday .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 0 2px; }
  .cday .dh strong { font: 600 18px/1.2 var(--head); }
  .cday .dh .label { color: var(--muted); }
  .cday .blocks { display: flex; flex-direction: column; gap: 10px; }
  .block { border-radius: 11px; padding: 11px 12px; min-height: 112px; display: flex; flex-direction: column; gap: 6px; border: 1px dashed var(--line-2); background: var(--panel); }
  .block .label { color: var(--muted); }
  .block .slotname { font-weight: 600; font-size: 14px; }
  .block .who { font: 600 15px/1.3 var(--head); gap: 0; }
  .block .act { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .block .act .btn { width: 100%; }
  .block.taken { background: #ECE9E0; border: 1px solid transparent; }
  .block.mine { background: var(--yellow); border: 1px solid transparent; box-shadow: var(--shadow-sm); }
  .block.mine .label { color: rgba(30,28,23,.6); }
  .block.mine .btn.danger { background: rgba(255,255,255,.55); border-color: rgba(30,28,23,.18); color: var(--ink); }
  .block.mine .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
  .block.past { opacity: .55; }
  .block .where { align-self: flex-start; font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; background: rgba(255,255,255,.6); color: var(--ink-2); }
  .block.mine .where { background: rgba(255,255,255,.55); color: var(--ink); }
  .block.choosing { border: 1px solid var(--gold); background: var(--yellow-wash); }
  .block .pick { font-size: 13px; font-weight: 600; color: var(--gold); }
  .block.choosing .act { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .block.choosing .act .btn { width: 100%; }
  .block.choosing .act .linkbtn { grid-column: 1 / -1; justify-self: center; padding: 2px; }
  .block .scriptsnote { font-size: 12px; color: var(--ink-2); }
  .block.mine .scriptsnote { color: rgba(30,28,23,.75); }

  /* ---------- Team (admin) ---------- */
  .teamtools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .person { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .person h3 { margin: 0; font: 600 18px/1.2 var(--head); }
  .person .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .person .personact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .person .personact .btn.ghost { flex: 1; }
  .remind { padding: 18px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; }
  .remindhead { display: flex; flex-direction: column; gap: 2px; }
  .remindhead h3 { margin: 0; font: 600 18px/1.2 var(--head); }
  .remindhead .muted { font-size: 13.5px; }
  .remindto { border: 0; margin: 0 0 6px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px 14px; }
  .remindto legend { margin-bottom: 6px; padding: 0; }
  .remindall { grid-column: 1 / -1; display: flex; gap: 10px; }
  .remindall .linkbtn { padding: 2px 0; }
  .tick { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 10px; cursor: pointer; background: var(--panel); min-width: 0; }
  .tick input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
  .tick span:first-of-type { font-weight: 600; flex: 1; min-width: 0; }
  .tick .muted { font-size: 12.5px; white-space: nowrap; }
  .remindinput { width: 100%; min-width: 0; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--ink); font: inherit; }
  textarea.remindinput { resize: vertical; line-height: 1.5; min-height: 220px; }
  .remindinput:focus { outline: 2px solid var(--yellow); border-color: var(--yellow); }
  .remindfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .remindfoot .muted { font-size: 13px; }
  .remindfoot .btn.armed { background: var(--ink); color: #fff; }
  .removedlist { margin-top: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .removedlist h3 { margin: 0; font: 600 17px/1.2 var(--head); }
  .removedlist p { margin: 0; font-size: 13.5px; }
  .removedrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
  .removedrow > span { min-width: 0; overflow-wrap: anywhere; }
  .dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .dots div { text-align: center; padding: 8px 2px 7px; border-radius: 9px; background: var(--panel-2); }
  .dots div.has { background: var(--yellow-soft); }
  .dots .n { font: 600 17px/1.1 var(--head); display: block; }
  .dots .label { font-size: 10px; color: var(--muted); }
  .dots div.has .label { color: var(--gold); }
  .booked { display: flex; flex-wrap: wrap; gap: 6px; }
  .bookinglist { margin-top: 26px; padding: 6px 0; }
  .bookinglist h3 { margin: 12px 18px 6px; font: 600 17px/1.2 var(--head); }
  .bookinglist table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .bookinglist th { text-align: left; font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding: 10px 18px; }
  .bookinglist td { padding: 10px 18px; border-top: 1px solid var(--line); vertical-align: top; }
  .bookinglist td.mono { font: 400 12px/1.4 var(--mono); color: var(--muted); }

  /* ---------- Gate, loading, toast ---------- */
  .gate { max-width: 460px; margin: 10vh auto 0; padding: 34px 30px; text-align: center; }
  .gate .mark { margin-bottom: 18px; }
  .gate h2 { font: 600 24px/1.25 var(--head); margin: 0 0 10px; }
  .gate p { color: var(--ink-2); margin: 0 0 20px; }
  .gate .btn { min-height: 46px; padding: 0 22px; font-size: 15px; }
  .gate small { display: block; margin-top: 18px; color: var(--muted); font-size: 12.5px; }
  .gate .notice { text-align: left; margin: 0 0 16px; }
  .signin { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .signin input {
    height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; padding: 0 14px;
    font-size: 16px; width: 100%; min-width: 0;
  }
  .signin input:focus { outline: 2px solid var(--yellow); outline-offset: 0; border-color: var(--yellow); }
  .signin #code { font: 600 24px/1 var(--mono); letter-spacing: .3em; text-align: center; }
  .signin .btn { min-height: 48px; font-size: 15px; }
  .signin .linkbtn { align-self: center; }
  .loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; color: var(--muted); font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(138,98,0,.2); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow);
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px); z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--red); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- Phones & small tablets ---------- */
  @media (max-width: 940px) {
    .cal { grid-template-columns: 1fr; gap: 10px; }
    .cday { display: grid; grid-template-columns: 74px 1fr; align-items: stretch; gap: 10px; padding: 12px; }
    .cday .dh { flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px; }
    .cday .blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .block { min-height: 104px; }
  }
  @media (max-width: 640px) {
    body { font-size: 15px; }
    .wrap { padding: 0 14px; }
    .top { padding: 14px 0 10px; }
    .brand h1 { font-size: 18px; }
    .mark { padding: 5px 8px; font-size: 12.5px; }
    .who .name, .who .tag { display: none; }
    .bar .wrap { gap: 10px; }
    .weekpick { width: 100%; }
    .selectwrap { flex: 1; }
    .selectwrap select { width: 100%; min-width: 0; font-size: 15px; padding-left: 12px; }
    .weekmeta { display: none; }
    .tabs { width: 100%; }

  /* ================= FTA Content Studio look (28 Oct) ================= */

const CALL_TIMEOUT_MS = 30000; // Apps Script can take 5–10 s when it's cold; past 30 s, signal is the problem
async function call(fn, ...args) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), CALL_TIMEOUT_MS) : null;
  let res, text;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args }),
      credentials: 'omit',
      redirect: 'follow',
      signal: ctrl ? ctrl.signal : undefined,
    });
    text = await res.text();
  } catch (e) {
    const err = new Error(e && e.name === 'AbortError'
      ? 'The hub is taking too long to answer. Check your signal and try again.'
      : 'Couldn’t reach the hub. Check your connection and try again.');
    err.network = true;
    throw err;
  } finally {
    if (timer) clearTimeout(timer);
  }
  try { return JSON.parse(text); }
  catch (e) { const err = new Error('The hub sent back something unexpected. Try again in a minute.'); err.network = true; throw err; }
}
function utc(iso) { const p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function addDays(iso, n) { const d = utc(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function weekLabel(iso) { const d = utc(iso); return 'w/c ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function shortWeek(label) { return String(label).replace(' ' + new Date().getFullYear(), ''); }
function firstName(n) { return String(n || '').trim().split(/\s+/)[0]; }
function nameKey(n) { return String(n || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function shortTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.getDate() + ' ' + MONTHS[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast' + (isErr ? ' err' : ''); }, Math.max(3200, String(msg).length * 70));
}

/* ---------- state ---------- */
const S = {
  token: '', boot: null, me: null, week: '', data: null, loading: false, req: 0,
  tab: 'scripts', who: 'all', bookAs: '', pending: '', armed: '', armTimer: null, choosing: '',
  fbEdit: null, viewer: '', popIdx: -1,
};

/* ---------- start ---------- */
async function start() {
  S.token = S.token || BOOT.token || store.get('fth.token') || '';
  if (BOOT.token) {
    store.set('fth.token', BOOT.token);
  }
  let r;
  try { r = await call('apiBootstrap', S.token); }
  catch (e) { return gate({ code: 'ERROR', message: e && e.message }); }
  if (!r || !r.ok) return gate(r || {});

  S.boot = r;
  S.me = r.user;
  S.week = r.defaultWeek;
  const savedTab = store.get('fth.tab');
  const tabs = tabList();
  S.tab = tabs.some((t) => t.id === savedTab) ? savedTab : 'scripts';
  S.bookAs = store.get('fth.bookAs') || r.user.email;
  renderWho();
  renderBar();
  loadWeek(false);
  if (S.started) return;
  S.started = true;
  checkForUpdate();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && S.data) loadWeek(false, true);
    if (document.visibilityState === 'visible') checkForUpdate();
  });
  setInterval(() => {
    if (document.visibilityState === 'visible' && S.tab === 'calendar' && S.data && !S.pending) loadWeek(false, true);
  }, 90000);
}

/**
 * Phones and browsers can keep showing an old copy of this page. Every so often, ask GitHub for
 * the current copy; if it's newer, quietly switch to it (never while someone is mid-way through something).
 */
async function checkForUpdate() {
  const last = Number(S.updCheck || 0);
  if (Date.now() - last < 4 * 60000) return;
  S.updCheck = Date.now();
  let txt = '';
  try { txt = await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store', credentials: 'omit' }).then((r) => (r.ok ? r.text() : '')); } catch (e) { return; }
  const m = /const BUILD = '(\d+)'/.exec(txt);
  if (!m || m[1] <= BUILD) return;
  let tried = ''; try { tried = sessionStorage.getItem('fth.updTried') || ''; } catch (e) {}
  if (tried === m[1]) return; // already tried this one; don't loop
  const busy = S.pending || S.fbEdit || S.remind || S.choosing || document.querySelector('dialog[open]');
  if (busy) { S.updCheck = Date.now() - 3 * 60000; return; } // try again in a minute
  try { sessionStorage.setItem('fth.updTried', m[1]); } catch (e) {}
  location.replace(location.pathname + '?v=' + m[1]);
}

function tabList() {
  const t = [{ id: 'scripts', label: S.me && S.me.isAdmin ? 'Scripts' : 'My scripts' }, { id: 'calendar', label: 'Calendar' }];
  if (S.me && S.me.isAdmin) t.push({ id: 'team', label: 'Team' });
  return t;
}

async function loadWeek(force, quiet) {
  const id = ++S.req;
  if (!quiet) { S.loading = true; renderMain(); }
  let r;
  try { r = await call('apiGetWeek', S.token, S.week, !!force, S.realMe ? S.me.email : ''); }
  catch (e) { r = { ok: false, code: 'ERROR', message: (e && e.message) || 'Couldn’t reach the hub.' }; }
  if (id !== S.req) return;
  S.loading = false;
  if (!r.ok) {
    if (r.code === 'SIGNIN' || r.code === 'DENIED') return gate(r);
    if (!quiet) { S.data = null; renderMain(r.message); }
    return;
  }
  S.data = r;
  renderBar();
  renderMain();
  if (force) toast('Refreshed from Drive');
}

/* ---------- gate (sign in / not allowed / errors) ---------- */
function gate(r) {
  $('#bar').hidden = true;
  $('#who').innerHTML = '';
  let title, body, actions = '';
  if (r.code === 'SIGNIN' || r.code === 'DENIED') {
    store.set('fth.token', null);
    S.token = '';
    if (r.code === 'DENIED') return signinForm(`<b>${esc(r.email)}</b> isn’t on the list any more. Ask Zach if that looks wrong.`);
    // Phones often reload the tab while you're in Mail getting the code: put you back on the code step.
    const sentAt = Number(store.get('fth.codeAt') || 0);
    if (sentAt && Date.now() - sentAt < 15 * 60000 && store.get('fth.email')) return signinForm('', 'code', store.get('fth.email'));
    return signinForm('');
  } else {
    title = 'Something went wrong';
    body = esc(r.message || 'The hub didn’t respond. Try reloading.');
    actions = `<button class="btn" data-act="restart">Try again</button>`;
  }
  $('#main').innerHTML = `
    <div class="panel gate">
      <span class="mark">FTA <i>×</i> TPC</span>
      <h2>${title}</h2>
      <p>${body}</p>
      ${actions}
      <small>Filming Hub for Frank Taylor &amp; Associates and The Principals Club</small>
    </div>`;
}

/* ---------- email sign-in ---------- */
function signinForm(note, step, email) {
  $('#bar').hidden = true;
  $('#who').innerHTML = '';
  const saved = email || store.get('fth.email') || '';
  const codeStep = step === 'code';
  $('#main').innerHTML = `
    <div class="panel gate">
      <span class="mark">FTA <i>×</i> TPC</span>
      <h2>${codeStep ? 'Check your email' : 'Sign in to the Filming Hub'}</h2>
      <p>${codeStep
        ? `If <b>${esc(saved)}</b> is on the hub’s list, a 6-digit code is on its way. It can take a minute, so check spam too. Nothing after a few minutes? Check the spelling, or ask Zach to add you.`
        : 'Enter the email address Zach has for you and we’ll send you a sign-in code.'}</p>
      ${note ? `<div class="notice" id="signin-note">${note}</div>` : '<div class="notice" id="signin-note" hidden></div>'}
      <form id="signin" class="signin" novalidate>
        ${codeStep
          ? `<label for="code" class="label">Code</label>
             <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" required>
             <button class="btn" type="submit" id="signin-go">Sign in</button>
             <button class="linkbtn" type="button" data-act="signin-back">Use a different email or send a new code</button>`
          : `<label for="email" class="label">Email</label>
             <input id="email" name="email" type="email" autocomplete="email" value="${esc(saved)}" placeholder="you@example.com" required>
             <button class="btn" type="submit" id="signin-go">Email me a code</button>
             <button class="linkbtn" type="button" data-act="signin-have">I already have a code</button>`}
      </form>
      <small>Filming Hub for Frank Taylor &amp; Associates and The Principals Club</small>
    </div>`;
  const input = $(codeStep ? '#code' : '#email');
  try { input.focus(); } catch (e) {}
  if (codeStep) input.addEventListener('input', () => {
    if (input.value.replace(/\D/g, '').length === 6 && !$('#signin-go').disabled) verifyCode(saved);
  });
  $('#signin').addEventListener('submit', (e) => { e.preventDefault(); codeStep ? verifyCode(saved) : requestCode(); });
}

function signinNote(msg) {
  const n = $('#signin-note');
  if (!n) return;
  n.innerHTML = esc(msg);
  n.hidden = false;
}

async function requestCode() {
  const email = $('#email').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return signinNote('Enter your full email address.');
  const btn = $('#signin-go');
  btn.disabled = true; btn.textContent = 'Sending…';
  let r;
  try { r = await call('apiRequestCode', email); }
  catch (e) { r = { ok: false, message: 'Couldn’t reach the hub. Check your connection and try again.' }; }
  if (!r.ok) { btn.disabled = false; btn.textContent = 'Email me a code'; return signinNote(r.message); }
  store.set('fth.email', email);
  store.set('fth.codeAt', String(Date.now()));
  signinForm('', 'code', email);
}

async function verifyCode(email) {
  const code = $('#code').value.replace(/\D/g, '');
  if (code.length !== 6) return signinNote('The code is 6 digits.');
  const btn = $('#signin-go');
  btn.disabled = true; btn.textContent = 'Checking…';
  let r;
  try { r = await call('apiVerifyCode', email, code); }
  catch (e) { r = { ok: false, message: 'Couldn’t reach the hub. Check your connection and try again.' }; }
  if (!r.ok) { btn.disabled = false; btn.textContent = 'Sign in'; return signinNote(r.message); }
  store.set('fth.token', r.token);
  store.set('fth.codeAt', null);
  S.token = r.token;
  $('#main').innerHTML = '<div class="loading"><span class="spinner"></span>Loading</div>';
  start();
}

function weekOptions() {

}

/* ---------- scripts ---------- */
function scriptsFor(name) {
  const me = nameKey(name), first = me.split(' ')[0];
  return S.data.scripts.filter((s) => nameKey(s.owner) === me || s.presenters.some((p) => {
    const k = nameKey(p);
    return k === me || (k.indexOf(' ') < 0 && k === first);
  }));
}
function bookingsFor(name) {
  if (!S.me.isAdmin) return S.data.bookings.filter((b) => b.mine);
  const em = emailOf(name);
  return S.data.bookings.filter((b) => (em ? b.email === em : nameKey(b.name) === nameKey(name)));
}
function slotLabel(key) { const s = S.boot.slots.find((x) => x.key === key); return s ? s.label : key; }

function viewScripts() {
  const d = S.data;
  const src = d.source;
  let html = '';
  if (!src.found && S.me.isAdmin && src.hidden) {
    return `<div class="panel empty"><h2>${esc(d.label)} has been removed</h2><p>Nobody can see this week’s scripts. Nothing was deleted from Drive. You can bring it back from <b>Removed weeks</b> on the Team tab.</p>
      <p style="margin-top:16px"><button class="btn" data-act="restoreweek" data-week="${esc(d.week)}" ${S.pending === 'week|' + d.week ? 'disabled' : ''}>${S.pending === 'week|' + d.week ? 'Restoring…' : 'Restore this week'}</button></p></div>`;
  }
  if (!src.found) {
    return `<div class="panel empty"><h2>No scripts for ${esc(d.label)} yet</h2><p>They’ll appear here as soon as the Script Maker exports this week. You can still book filming blocks in the calendar.</p></div>`;
  }
  if (src.problem) html += `<div class="notice">${esc(src.problem)}</div>`;

  let list = d.scripts;
  let viewer = S.me.name;
  if (S.me.isAdmin) {
    const names = [];
    (S.boot.people || []).filter((p) => !p.isAdmin).forEach((p) => names.push(p.name));
    d.scripts.forEach((s) => { if (s.owner && !names.some((n) => nameKey(n) === nameKey(s.owner))) names.push(s.owner); });
    if (S.who !== 'all' && !names.some((n) => n === S.who)) S.who = 'all';
    html += '<div class="filters" role="group" aria-label="Presenter">' +
      `<button data-act="who" data-who="all" aria-pressed="${S.who === 'all'}">Everyone<small>${d.scripts.length}</small></button>` +
      names.map((n) => `<button data-act="who" data-who="${esc(n)}" aria-pressed="${S.who === n}">${esc(n)}<small>${scriptsFor(n).length}</small></button>`).join('') +
      '</div>';
    if (S.who !== 'all') { list = scriptsFor(S.who); viewer = S.who; }
    else viewer = '';
  }

  if (!list.length) {
    const who = S.me.isAdmin ? (S.who === 'all' ? 'anyone' : S.who) : 'you';
    html += `<div class="panel empty"><h2>No scripts for ${esc(who)} this week</h2><p>${S.me.isAdmin ? 'Nothing in this export matches that name.' : 'Nothing in this week’s export has your name on it. If that looks wrong, let Zach know.'}</p></div>`;
    return html;
  }

  if (viewer) html += filmBanner(viewer);
  // Two sections: what's still to film, and what's been filmed.
  S.viewer = viewer;
  const toFilm = list.filter((s) => !isFilmed(s)), done = list.filter(isFilmed);
  const n = (k) => `${k} script${k === 1 ? '' : 's'}`;
  html += `<section class="day">
      <div class="dayhead"><h2>${esc(S.me.isAdmin && S.who === 'all' ? 'Still to film' : 'Scripts to film')}</h2><span class="label">${n(toFilm.length)}</span></div>
      ${toFilm.length
        ? `<div class="cards">${toFilm.map((s) => scriptCard(s, viewer)).join('')}</div>`
        : `<div class="panel alldone">${ICON.check}<div><b>All filmed</b><span>Everything for ${esc(d.label)} has been ticked off.</span></div></div>`}
    </section>`;
  if (done.length) {
    html += `<section class="day filmedsec">
      <div class="dayhead"><h2>Filmed</h2><span class="label">${n(done.length)}</span></div>
      <div class="cards">${done.map((s) => scriptCard(s, viewer)).join('')}</div>
    </section>`;
  }
  return html;
}

function isFilmed(s) { return !!(S.data.filmed && S.data.filmed[s.key]); }
function slotOf(key) { return S.boot.slots.find((x) => x.key === key) || { startMin: 0, endMin: 0, label: key, start: '', end: '' }; }

/** "You're filming Tue morning · In" or a nudge to book. */
function filmBanner(viewer) {
  const d = S.data, self = !S.me.isAdmin;
  const first = firstName(viewer);
  const bk = bookingsFor(viewer).slice().sort((a, b) => (a.date + a.slot < b.date + b.slot ? -1 : 1));
  const upcoming = bk.filter((b) => !blockState(b.date, slotOf(b.slot)).ended);
  const finished = d.days[d.days.length - 1].date < d.now.date;
  if (upcoming.length) {
    const parts = upcoming.map((b) => {
      const day = d.days.find((x) => x.date === b.date);
      const sl = slotOf(b.slot);
      return { when: `${day ? day.dow + ' ' + day.label : b.date}, ${sl.label.toLowerCase()}`, sub: `${sl.start}–${sl.end}${b.location ? ' · ' + (b.location === 'In' ? 'In (studio)' : 'Out (on location)') : ''}` };
    });
    const now = upcoming[0].date === d.now.date && blockState(upcoming[0].date, slotOf(upcoming[0].slot)).started;
    const lead = now ? (self ? 'You’re filming now' : `${first} is filming now`) : (self ? 'You’re filming ' : `${first} is filming `) + parts[0].when;
    return `<div class="panel filmbanner">
      <span class="fb-icon">${ICON.cam}</span>
      <div class="txt"><b>${esc(lead)}</b><span>${esc(parts[0].sub)}${parts.length > 1 ? esc(' · also ' + parts.slice(1).map((p) => p.when).join(', ')) : ''}</span></div>
      <button class="btn ghost small" data-act="tab" data-tab="calendar">${ICON.cal}See calendar</button>
    </div>`;
  }
  if (bk.length || finished) return '';
  return `<div class="panel filmbanner todo">
    <span class="fb-icon">${ICON.cal}</span>
    <div class="txt"><b>${esc(self ? 'You haven’t booked filming yet' : `${first} hasn’t booked filming yet`)}</b><span>Pick a morning or afternoon for ${esc(d.label)}.</span></div>
    <button class="btn small" data-act="gobook" data-who="${esc(viewer)}">Book a block</button>
  </div>`;
}

/* ---------- script feedback ---------- */
function fbList(s) { return (S.data.feedback && S.data.feedback[s.key]) || []; }
function fbFor(s, name) {
  const em = S.me.isAdmin ? emailOf(name) : S.me.email;
  return fbList(s).find((f) => (em ? f.email === em : nameKey(f.name) === nameKey(name)));
}
const FB_LABEL = { happy: 'Happy', changes: 'Changes', scrap: 'Scrap' };

/** The presenter's Happy / Changes / Scrap buttons, with a note box for changes. */
function feedbackBlock(s, idx) {
  const mine = fbList(s).find((f) => f.email === S.me.email);
  const st = mine ? mine.status : '';
  const ed = S.fbEdit && S.fbEdit.key === s.key ? S.fbEdit : null;
  const busy = S.pending === 'fb|' + s.key;
  const on = ed ? ed.status : st;
  const btn = (k) => `<button class="fbbtn ${k}" data-act="fb" data-status="${k}" data-i="${idx}" aria-pressed="${on === k}" ${busy ? 'disabled' : ''}>${ICON[k]}${FB_LABEL[k]}</button>`;
  let html = `<div class="fb"><div class="q">${st ? 'Your answer' : 'Happy to film this one?'}</div>
    <div class="fbopts" role="group" aria-label="Your answer">${btn('happy')}${btn('changes')}${btn('scrap')}</div>`;
  if (ed) {
    html += `<textarea class="fbnote" data-fbnote="${esc(s.key)}" maxlength="1500" aria-label="Note for Zach" placeholder="${ed.status === 'changes' ? 'What would you like changed?' : 'Why scrap it? (optional)'}">${esc(ed.note)}</textarea>
      <div class="fbrow">
        <button class="btn small" data-act="fbsend" data-i="${idx}" ${busy ? 'disabled' : ''}>${busy ? 'Sending…' : 'Send to Zach'}</button>
        <button class="btn ghost small" data-act="fbcancel" ${busy ? 'disabled' : ''}>Cancel</button>
        ${st ? `<button class="linkbtn" data-act="fbclear" data-i="${idx}" ${busy ? 'disabled' : ''}>Remove my answer</button>` : ''}
      </div>`;
  } else if (mine && mine.note) {
    html += `<p class="fbsaid"><b>You said</b>${esc(mine.note)}</p>`;
  }
  return html + '</div>';
}

/** What each presenter said about a script (admin view). */
function feedbackSummary(s, people) {
  const chips = people.map((p) => {
    const f = fbFor(s, p);
    return f ? `<span class="chip st-${f.status}">${esc(firstName(p))}: ${FB_LABEL[f.status]}</span>` : `<span class="chip st-wait">${esc(firstName(p))}: no answer</span>`;
  }).join('');
  const notes = people.map((p) => { const f = fbFor(s, p); return f && f.note ? `<p class="fbsaid"><b>${esc(firstName(p))} said</b>${esc(f.note)}</p>` : ''; }).join('');
  return `<div class="fb"><div class="chips">${chips}</div>${notes}</div>`;
}

async function sendFeedback(i, status, note) {
  const s = S.data.scripts[i];
  if (!s) return;
  const key = 'fb|' + s.key;
  S.pending = key; renderMain(); refreshPop();
  let r;
  try { r = await call('apiSetFeedback', S.token, S.data.week, s.key, status, note || ''); }
  catch (e) { r = { ok: false, network: true, message: (e && e.message) || 'Couldn’t send that.' }; }
  S.pending = '';
  if (r && (r.code === 'SIGNIN' || r.code === 'DENIED')) return gate(r);
  if (r && r.ok) { S.data.feedback = r.feedback || {}; if (S.fbEdit && S.fbEdit.key === s.key) S.fbEdit = null; }
  renderMain(); refreshPop();
  toast((r && r.message) || 'Something went wrong', !(r && r.ok));
}

async function toggleFilmed(i) {
  const s = S.data.scripts[i];
  if (!s) return;
  const want = !isFilmed(s);
  S.pending = 'film|' + s.key; renderMain(); refreshPop();
  let r;
  try { r = await call('apiSetFilmed', S.token, S.data.week, s.key, want); }
  catch (e) { r = { ok: false, message: (e && e.message) || 'Couldn’t update that.' }; }
  S.pending = '';
  if (r && (r.code === 'SIGNIN' || r.code === 'DENIED')) return gate(r);
  if (r && r.ok) S.data.filmed = r.filmed || {};
  renderMain(); refreshPop();
  toast((r && r.message) || 'Something went wrong', !(r && r.ok));
}

function emailOf(name) {
  const p = (S.boot.people || []).find((x) => nameKey(x.name) === nameKey(name));
  return p ? p.email : '';
}

function scriptBits(s, viewer) {
  const idx = S.data.scripts.indexOf(s);
  const people = s.presenters.length ? s.presenters : [s.owner];
  const isMe = (p) => viewer && nameKey(p) === nameKey(viewer);
  const who = people.map((p) => `<span class="${isMe(p) ? 'me' : ''}">${esc(p)}${isMe(p) && people.length > 1 ? ' (you)' : ''}</span>`).join('<i> &amp; </i>');
  const chips = [];
  if (s.format) chips.push(`<span class="chip fmt">${esc(s.format)}</span>`);
  if (people.length > 1) chips.push(`<span class="chip">${people.length === 2 ? 'Two-hander' : people.length + ' presenters'}</span>`);
  if (s.trend) chips.push(`<span class="chip trend"><b>${esc(s.trend.section || 'Trend')}</b>${esc(s.trend.title)}</span>`);
  const filmed = isFilmed(s);
  if (filmed) chips.unshift(`<span class="chip done">${ICON.check.replace('<svg', '<svg width="13" height="13"')}Filmed</span>`);
  const fbusy = S.pending === 'film|' + s.key;
  const filmLabel = filmed ? 'Filmed. Tap to undo' : 'Mark as filmed';
  const filmBtn = `<button class="filmbox ${filmed ? 'on' : ''} ${fbusy ? 'busy' : ''}" data-act="filmed" data-i="${idx}" aria-pressed="${filmed}" aria-label="${filmLabel}" title="${filmLabel}" ${fbusy ? 'disabled' : ''}>${ICON.check}</button>`;
  const tpBtn = s.lines.length ? `<button class="btn small" data-act="prompter" data-i="${idx}">${ICON.prompter}Teleprompter</button>` : '';
  const copyBtn = s.lines.length ? `<button class="btn ghost small" data-act="copyscript" data-i="${idx}">Copy script</button>` : '';
  const docBtn = s.docUrl ? `<a class="btn ghost small" href="${esc(s.docUrl)}" target="_blank" rel="noopener">Open Google Doc</a>` : '';
  const fb = S.me.isAdmin ? feedbackSummary(s, people) : feedbackBlock(s, idx);
  return { idx, people, isMe, who, chips, filmed, fb, cardActions: tpBtn + copyBtn + filmBtn, actions: tpBtn + copyBtn + docBtn + filmBtn };
}

function scriptCard(s, viewer) {
  const b = scriptBits(s, viewer);
  return `<article class="panel script ${b.filmed ? 'filmed' : ''}">
    <div class="toprow"><span class="label presenters">${b.who}</span></div>
    <h3>${esc(s.title)}</h3>
    ${b.chips.length ? `<div class="chips">${b.chips.join('')}</div>` : ''}
    ${s.lines[0] ? `<p class="preview" data-act="readscript" data-i="${b.idx}">${esc(s.lines[0].say)}</p>` : ''}
    <button class="readbtn" data-act="readscript" data-i="${b.idx}" aria-haspopup="dialog">
      <span class="sum-label">Read script${s.caption ? ' &amp; caption' : ''}</span>
      <span class="sum-count">${s.lines.length} line${s.lines.length === 1 ? '' : 's'}</span>
    </button>
    ${b.fb}
    <div class="foot">${b.cardActions}</div>
  </article>`;
}

function openScript(i) {
  const s = S.data && S.data.scripts[i];
  if (!s) return;
  const viewer = S.viewer || '';
  const b = scriptBits(s, viewer);
  const { people, isMe, idx } = b;

  const myFirst = nameKey(firstName(viewer));
  const myFull = nameKey(viewer);
  const inIt = people.some(isMe);

    const raw = nameKey(l.speaker);

    const mine = viewer && ((k === 'both' || k === 'all') ? inIt : (k === myFull || k === myFirst || k.split(' ')[0] === myFirst));
    return `<p class="${mine ? 'mine' : 'other'}"><span class="spk">${esc(l.speaker)}${mine ? ' · you' : ''}</span>${esc(l.say)}</p>`;

      <div class="caption">

      </div>` : '';

  let d = document.getElementById('scriptpop');

    d.setAttribute('aria-labelledby', 'pop-title');
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); }); // click the dim backdrop
    wireModal(d, () => { S.popIdx = -1; });
    document.body.appendChild(d);
  }
  const keep = d.open && S.popIdx === i ? d.querySelector('.pop-body').scrollTop : 0;
  S.popIdx = i;
  d.innerHTML = `
    <div class="pop-head">
      <div class="t">
        <span class="label presenters">${b.who}</span>
        <h3 id="pop-title">${esc(s.title)}</h3>
        ${b.chips.length ? `<div class="chips">${b.chips.join('')}</div>` : ''}
      </div>
      <button class="pop-close" data-act="closescript" aria-label="Close">&times;</button>
    </div>
    <div class="pop-body">
      <div class="lines">${lines}</div>

      <div style="margin-top:16px">${b.fb}</div>
    </div>

  const wasOpen = d.open;
  openModal(d);
  d.querySelector('.pop-body').scrollTop = keep;
  if (!wasOpen) d.querySelector('.pop-close').focus();
}

/** Re-draws the open script pop-out after something changed (feedback, filmed). */
function refreshPop() {
  const d = document.getElementById('scriptpop');
  if (d && d.open && S.popIdx >= 0) {
    const ta = d.querySelector('.fbnote'), focused = ta && document.activeElement === ta;
    openScript(S.popIdx);
    const ta2 = d.querySelector('.fbnote');
    if (focused && ta2) { ta2.focus(); ta2.setSelectionRange(ta2.value.length, ta2.value.length); }
  }
}

/* ---------- pop-ups and the phone's Back button ---------- */
function openModal(d) {
  if (d.open) return;
  document.body.classList.add('popping');
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  d._lvl = ((history.state && history.state.pop) || 0) + 1;
  try { history.pushState({ pop: d._lvl }, ''); } catch (e) {}
}
function wireModal(d, onClose) {
  d.addEventListener('close', () => {
    if (onClose) onClose();
    if (history.state && history.state.pop === d._lvl) { S.selfBack = true; try { history.back(); } catch (e) { S.selfBack = false; } }
    if (!document.querySelector('dialog[open]')) document.body.classList.remove('popping');
  });
}

/* ---------- teleprompter ---------- */
const TP = Object.assign({ size: 44, speed: 3, mirror: false }, (() => { try { return JSON.parse(store.get('fth.tp') || '{}'); } catch (e) { return {}; } })(), { playing: false, raf: 0, last: 0, pos: 0, lock: null });
function tpSave() { store.set('fth.tp', JSON.stringify({ size: TP.size, speed: TP.speed, mirror: TP.mirror })); }

function openPrompter(i) {
  const s = S.data && S.data.scripts[i];
  if (!s || !s.lines.length) return;
  const viewer = S.viewer || '';
  const people = s.presenters.length ? s.presenters : [s.owner];
  const myFirst = nameKey(firstName(viewer)), myFull = nameKey(viewer);
  const inIt = viewer && people.some((p) => nameKey(p) === myFull);
  const lines = s.lines.map((l) => {
    if (!l.speaker) return `<p>${esc(l.say)}</p>`;
    const raw = nameKey(l.speaker);
    const k = (/\(([^)]+)\)/.exec(raw) || [, raw])[1].trim();
    const mine = !viewer || ((k === 'both' || k === 'all') ? inIt : (k === myFull || k === myFirst || k.split(' ')[0] === myFirst));
    return `<p class="${mine ? 'mine' : 'other'}"><span class="spk">${esc(l.speaker)}</span>${esc(l.say)}</p>`;
  }).join('');
  let d = document.getElementById('prompter');
  if (!d) {
    d = document.createElement('dialog');
    d.id = 'prompter'; d.className = 'tp';
    d.setAttribute('aria-label', 'Teleprompter');
    wireModal(d, () => {
      tpStop();
      try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
    });
    d.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'k') { e.preventDefault(); tpToggle(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); tpSpeed(1); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); tpSpeed(-1); }
      else if (e.key === '+' || e.key === '=') tpSize(1);
      else if (e.key === '-') tpSize(-1);
    });
    document.body.appendChild(d);
  }
  d.innerHTML = `
    <div class="tp-stage" data-act="tptoggle"><div class="tp-guide"></div>
      <div class="tp-text ${TP.mirror ? 'mirror' : ''}">${lines}<p class="end">End of script</p></div>
    </div>
    <div class="tp-bar">
      <button class="tpb" data-act="tpclose" aria-label="Close teleprompter">${ICON.close}</button>
      <button class="tpb" data-act="tprestart" aria-label="Back to the start">${ICON.restart}</button>
      <span class="tp-grp"><button class="tpb" data-act="tpsize" data-d="-1" aria-label="Smaller text">A−</button><span class="tp-val" id="tp-size">${TP.size}<small>size</small></span><button class="tpb" data-act="tpsize" data-d="1" aria-label="Bigger text">A+</button></span>
      <span class="tp-grp"><button class="tpb" data-act="tpspeed" data-d="-1" aria-label="Slower">−</button><span class="tp-val" id="tp-speed">${TP.speed}<small>speed</small></span><button class="tpb" data-act="tpspeed" data-d="1" aria-label="Faster">+</button></span>
      <button class="tpb" data-act="tpmirror" aria-pressed="${TP.mirror}">${ICON.mirror}<span class="lbl">Mirror</span></button>
      <button class="tpb play" data-act="tpplay" id="tp-play">${ICON.play}<span class="lbl">Start</span></button>
    </div>`;
  const stage = d.querySelector('.tp-stage');
  stage.addEventListener('scroll', () => { if (Math.abs(stage.scrollTop - TP.pos) > 3) TP.pos = stage.scrollTop; }, { passive: true });
  TP.pos = 0;
  tpApply();
  openModal(d);
  tpApply();
  stage.scrollTop = 0;
  d.querySelector('#tp-play').focus();
  // Full screen where the phone allows it (Android, laptops). iPhones already fill the screen.
  // (Full screen goes on the teleprompter itself: putting the whole page full screen would cover it.)
  try { if (d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) {}
}
function tpEls() { const d = document.getElementById('prompter'); return d && d.open ? { d, stage: d.querySelector('.tp-stage'), text: d.querySelector('.tp-text') } : null; }
function tpApply() {
  const d = document.getElementById('prompter'); if (!d) return;
  const t = d.querySelector('.tp-text'), stg = d.querySelector('.tp-stage');
  if (t) {
    t.style.fontSize = TP.size + 'px'; t.classList.toggle('mirror', !!TP.mirror);
    // First line starts on the reading guide (36% down).
    if (stg && stg.clientHeight) t.style.paddingTop = Math.max(20, Math.round(stg.clientHeight * 0.36 - TP.size * 0.75)) + 'px';
  }
  const sz = d.querySelector('#tp-size'), sp = d.querySelector('#tp-speed');
  if (sz) sz.firstChild.nodeValue = TP.size;
  if (sp) sp.firstChild.nodeValue = TP.speed;
  const m = d.querySelector('[data-act=tpmirror]'); if (m) m.setAttribute('aria-pressed', !!TP.mirror);
  const p = d.querySelector('#tp-play');
  if (p) p.innerHTML = (TP.playing ? ICON.pause : ICON.play) + `<span class="lbl">${TP.playing ? 'Pause' : (TP.pos > 5 ? 'Resume' : 'Start')}</span>`;
  d.classList.toggle('playing', TP.playing);
}
function tpTick(t) {
  const e = tpEls();
  if (!e || !TP.playing) return;
  const dt = Math.min(0.1, (t - (TP.last || t)) / 1000); TP.last = t;
  TP.pos += TP.speed * 14 * (TP.size / 44) * dt;
  const max = e.stage.scrollHeight - e.stage.clientHeight;
  if (TP.pos >= max) { TP.pos = max; e.stage.scrollTop = max; tpStop(); return; }
  e.stage.scrollTop = TP.pos;
  TP.raf = requestAnimationFrame(tpTick);
}
function tpPlay() {
  const e = tpEls(); if (!e) return;
  TP.pos = e.stage.scrollTop; TP.last = 0; TP.playing = true;
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { TP.lock = l; }).catch(() => {}); } catch (err) {}
  cancelAnimationFrame(TP.raf); TP.raf = requestAnimationFrame(tpTick); tpApply();
}
function tpStop() {
  TP.playing = false; cancelAnimationFrame(TP.raf);
  try { if (TP.lock) TP.lock.release(); } catch (e) {}
  TP.lock = null;
  tpApply();
}
function tpToggle() { TP.playing ? tpStop() : tpPlay(); }
function tpSpeed(dlt) { TP.speed = Math.max(1, Math.min(12, TP.speed + dlt)); tpSave(); tpApply(); }
function tpSize(dlt) {
  const e = tpEls(); const frac = e ? e.stage.scrollTop / Math.max(1, e.stage.scrollHeight) : 0;
  TP.size = Math.max(24, Math.min(96, TP.size + dlt * 4)); tpSave(); tpApply();
  if (e) { e.stage.scrollTop = frac * e.stage.scrollHeight; TP.pos = e.stage.scrollTop; }
}

/* ---------- calendar ---------- */
function blockState(date, slot) {
  const now = S.data.now;
  const started = date < now.date || (date === now.date && slot.startMin <= now.minutes);
  const ended = date < now.date || (date === now.date && slot.endMin <= now.minutes);
  return { started, ended };
}

function viewCalendar() {
  const d = S.data;
  const admin = S.me.isAdmin;
  let tools = '';
  if (admin) {
    const people = S.boot.people || [];
    if (!people.some((p) => p.email === S.bookAs)) S.bookAs = S.me.email;
    tools = `<label class="bookas">Book as
      <select id="bookas">${people.map((p) => `<option value="${esc(p.email)}" ${p.email === S.bookAs ? 'selected' : ''}>${esc(p.email === S.me.email ? p.name + ' (me)' : p.name)}</option>`).join('')}</select>
    </label>`;
  }
  const cols = d.days.map((day) => {
    const isToday = day.date === d.now.date;
    const blocks = S.boot.slots.map((slot) => {
      const b = d.bookings.find((x) => x.date === day.date && x.slot === slot.key);
      const st = blockState(day.date, slot);
      const key = day.date + '|' + slot.key;
      const busy = S.pending === key;
      let cls = 'block', who = '', act = '';
      if (b) {
        cls += b.mine ? ' mine' : ' taken';
        who = `<span class="who">${b.mine ? 'You' : esc(b.name)}</span>` +
          (b.location ? `<span class="where ${b.location === 'In' ? 'in' : 'out'}">${b.location === 'In' ? 'In · studio' : 'Out · on location'}</span>` : '');
        if ((b.mine && !st.started) || admin) {
          const armed = S.armed === key;
          act = `<button class="btn small danger ${armed ? 'armed' : ''}" data-act="cancel" data-date="${day.date}" data-slot="${slot.key}" ${busy ? 'disabled' : ''}>${busy ? 'Cancelling…' : (armed ? 'Tap to confirm' : 'Cancel')}</button>`;
        }
      } else if (st.started && !admin) {
        who = `<span class="muted" style="font-size:13px">${st.ended ? 'Past' : 'In progress'}</span>`;
      } else {
        const choosing = S.choosing === key;
        if (busy) {
          who = `<span class="muted" style="font-size:13px">Booking…</span>`;
          act = `<button class="btn small" disabled>Booking…</button>`;
        } else if (choosing) {
          cls += ' choosing';
          who = `<span class="pick">Where are you filming?</span>`;
          act = `<button class="btn small" data-act="bookwhere" data-where="In" data-date="${day.date}" data-slot="${slot.key}">In</button>
            <button class="btn small" data-act="bookwhere" data-where="Out" data-date="${day.date}" data-slot="${slot.key}">Out</button>
            <button class="linkbtn" data-act="bookback">Back</button>`;
        } else {
          who = `<span class="muted" style="font-size:13px">Free</span>`;
          act = `<button class="btn small" data-act="book" data-date="${day.date}" data-slot="${slot.key}">Book</button>`;
        }
      }
      if (st.ended) cls += ' past';
      return `<div class="${cls}">
        <span class="label">${esc(slot.start)}–${esc(slot.end)}</span>
        <span class="slotname">${esc(slot.label)}</span>
        ${who}
        <div class="act">${act}</div>
      </div>`;
    }).join('');
    return `<div class="panel cday ${isToday ? 'today' : ''}">
      <div class="dh"><strong>${day.dow}</strong><span class="label">${esc(day.label)}${isToday ? ' · today' : ''}</span></div>
      <div class="blocks">${blocks}</div>
    </div>`;
  }).join('');

  const myCount = d.bookings.filter((b) => b.mine).length;
  const summary = admin
    ? `${d.bookings.length} of ${d.days.length * S.boot.slots.length} blocks booked`
    : (myCount ? `You’ve booked ${myCount} block${myCount === 1 ? '' : 's'} this week` : 'You haven’t booked a block this week');
  const lastDay = d.days[d.days.length - 1].date;
  const finished = lastDay < d.now.date;
  const notice = finished && S.week !== S.boot.currentWeek
    ? `<div class="notice weeknote"><span>${esc(d.label)} has finished, so there’s nothing left to book.</span><button class="btn small" data-act="thisweek">Go to this week</button></div>`
    : '';
  return `${notice}<div class="calhead">
      <div><div class="label">${esc(summary)}</div></div>
      <div class="legend"><span class="l-free">Free</span><span class="l-mine">${admin ? 'Booked by you' : 'Yours'}</span><span class="l-taken">Taken</span></div>
      ${tools}
    </div>
    <div class="cal">${cols}</div>`;
}

Your scripts for ${label} are ready on the Filming Hub: https://ghostcohd.github.io/filming-hub/

Before the week starts, please:

Zach`,

  const people = (S.boot.people || []).filter((p) => !p.isAdmin);

async function sendReminder() {
  const r = S.remind;
  const emails = Object.keys(r.to).filter((e) => r.to[e]);
  if (!emails.length) return toast('Tick at least one person', true);
  if (S.armed !== 'remind') {
    S.armed = 'remind'; renderMain();
    clearTimeout(S.armTimer);
    S.armTimer = setTimeout(() => { if (S.armed === 'remind') { S.armed = ''; renderMain(); } }, 4000);
    return;
  }
  S.armed = ''; S.pending = 'remind'; renderMain();
  let res;
  try { res = await call('apiSendReminder', S.token, emails, r.subject, r.message, S.week); }
  catch (e) { res = { ok: false, message: (e && e.message) || 'Couldn’t send the emails.' }; }
  S.pending = '';
  if (res && (res.code === 'SIGNIN' || res.code === 'DENIED')) return gate(res);
  if (res && res.ok) S.remind = null;
  renderMain();
  toast((res && res.message) || 'Something went wrong', !(res && res.ok));
}

/** Admin: every Changes / Scrap answer this week, with the notes. */
function viewFeedbackList() {
  const d = S.data;
  if (!d.source.found || !d.scripts.length) return '';
  const items = [];
  d.scripts.forEach((s) => fbList(s).forEach((f) => { if (f.status !== 'happy') items.push({ s, f }); }));
  const answered = d.scripts.reduce((n, s) => n + fbList(s).length, 0);

    ${items.map(({ s, f }) => `<div class="fbitem"><div class="t">

    const tally = { happy: 0, changes: 0, scrap: 0, wait: 0 };

/* ---------- actions ---------- */
async function book(date, slot, where) {
  const key = date + '|' + slot;
  S.choosing = '';
  S.pending = key; renderMain();
  let r;
  try { r = await call('apiBook', S.token, date, slot, S.me.isAdmin ? S.bookAs : null, where); }
  catch (e) { r = { ok: false, network: true, message: (e && e.message) || 'Couldn’t book that block.' }; }
  S.pending = '';
  afterAction(r);
}

async function cancel(date, slot) {
  const key = date + '|' + slot;
  if (S.armed !== key) {
    S.armed = key; renderMain();
    clearTimeout(S.armTimer);
    S.armTimer = setTimeout(() => { if (S.armed === key) { S.armed = ''; renderMain(); } }, 4000);
    return;
  }
  S.armed = ''; S.pending = key; renderMain();
  let r;
  try { r = await call('apiCancel', S.token, date, slot); }
  catch (e) { r = { ok: false, network: true, message: (e && e.message) || 'Couldn’t cancel that block.' }; }
  S.pending = '';
  afterAction(r);
}

async function setPersonActive(email, active) {
  const key = 'person|' + email;
  if (!active && S.armed !== key) {
    S.armed = key; renderMain();
    clearTimeout(S.armTimer);
    S.armTimer = setTimeout(() => { if (S.armed === key) { S.armed = ''; renderMain(); } }, 4000);
    return;
  }
  S.armed = ''; S.pending = key; renderMain();
  let r;
  try { r = await call('apiSetPersonActive', S.token, email, active); }
  catch (e) { r = { ok: false, message: (e && e.message) || 'Couldn’t update that person.' }; }
  S.pending = '';
  if (r && (r.code === 'SIGNIN' || r.code === 'DENIED')) return gate(r);
  if (r && r.ok) { S.boot.people = r.people; S.boot.removedPeople = r.removedPeople; }
  renderMain();
  toast((r && r.message) || 'Something went wrong', !(r && r.ok));
}

async function setWeekHidden(hide, week) {
  week = week || S.week;
  const key = 'week|' + week;
  if (hide && S.armed !== key) {
    S.armed = key; renderMain();
    clearTimeout(S.armTimer);
    S.armTimer = setTimeout(() => { if (S.armed === key) { S.armed = ''; renderMain(); } }, 4000);
    return;
  }
  S.armed = ''; S.pending = key; renderMain();
  let r;
  try { r = await call('apiSetWeekHidden', S.token, week, hide); }
  catch (e) { r = { ok: false, message: (e && e.message) || 'Couldn’t update that week.' }; }
  S.pending = '';
  if (r && (r.code === 'SIGNIN' || r.code === 'DENIED')) return gate(r);
  if (r && r.ok) {
    S.boot.weeks = r.weeks; S.boot.removedWeeks = r.removedWeeks;
    toast(r.message);
    if (hide && S.week === week) { S.week = ''; return setWeek(S.boot.defaultWeek === week ? S.boot.currentWeek : S.boot.defaultWeek); }
    if (S.week === week) return loadWeek(false, true).then(renderBar);
    renderBar(); renderMain();
    return;
  }
  renderMain();
  toast((r && r.message) || 'Something went wrong', true);
}

function afterAction(r) {
  if (r && (r.code === 'SIGNIN' || r.code === 'DENIED')) return gate(r);
  if (r && r.bookings && S.data) S.data.bookings = r.bookings;
  renderMain();
  toast((r && r.message) || (r && r.ok ? 'Done' : 'Something went wrong'), !(r && r.ok));
  // The request may have reached the hub even though the answer didn't reach us. Check, quietly.
  if (r && r.network) setTimeout(() => { if (S.data && !S.pending) loadWeek(false, true); }, 1500);
}

/** Just the spoken lines, ready for a teleprompter. Two-handers keep who says what. */
function teleprompterText(s) {
  const twoPeople = s.lines.some((l) => l.speaker);
  return s.lines
    .map((l) => (twoPeople && l.speaker ? l.speaker.toUpperCase() + ': ' : '') + l.say.trim())
    .join('\n\n');
}

function copyText(text, what) {
  const done = () => toast((what || 'Caption') + ' copied');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Couldn’t copy — select the text instead', true); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function toggleAcct(force) {
  const btn = document.querySelector('.acctbtn'), menu = document.querySelector('.acctmenu');
  if (!btn || !menu) return;
  const open = force === undefined ? menu.hidden : force;
  menu.hidden = !open; btn.setAttribute('aria-expanded', open);
  if (open) { const first = menu.querySelector('button'); if (first) first.focus(); }
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.acct')) { const m = document.querySelector('.acctmenu'); if (m && !m.hidden) toggleAcct(false); }
});
document.addEventListener('keydown', (e) => {
  const m = document.querySelector('.acctmenu');
  if (e.key === 'Escape' && m && !m.hidden) { toggleAcct(false); const b = document.querySelector('.acctbtn'); if (b) b.focus(); }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (S.realMe && PV_BLOCKED.indexOf(act) >= 0) {
    toast('Presenter view is look-only. Exit it to make changes.');
    return;
  }
  if (act === 'acct') { toggleAcct(); return; }
  if (['pvopen', 'pvexit', 'signout'].indexOf(act) >= 0) toggleAcct(false);
  if (act === 'pvopen') { openPvPicker(); return; }
  if (act === 'pvclose') { const d = document.getElementById('pvpick'); if (d) d.close(); return; }
  if (act === 'pvas') { const d = document.getElementById('pvpick'); if (d) d.close(); enterPresenterView(el.dataset.email); return; }
  if (act === 'pvexit') { exitPresenterView(); return; }
  if (act === 'tab') { const pd = document.getElementById('scriptpop'); if (pd && pd.open) pd.close(); S.tab = el.dataset.tab; if (!S.realMe) store.set('fth.tab', S.tab); renderBar(); renderMain(); window.scrollTo(0, 0); }
  else if (act === 'prev') setWeek(addDays(S.week, -7));
  else if (act === 'next') setWeek(addDays(S.week, 7));
  else if (act === 'who') { S.who = el.dataset.who; renderMain(); }
  else if (act === 'remindopen') { if (S.remind) S.remind = null; else openReminder(); renderMain(); }
  else if (act === 'remindall' || act === 'remindnone') { Object.keys(S.remind.to).forEach((k) => { S.remind.to[k] = act === 'remindall'; }); renderMain(); }
  else if (act === 'remindsend') sendReminder();
  else if (act === 'removeperson') setPersonActive(el.dataset.email, false);
  else if (act === 'restoreperson') setPersonActive(el.dataset.email, true);
  else if (act === 'seescripts') { S.who = el.dataset.who; S.tab = 'scripts'; store.set('fth.tab', S.tab); renderBar(); renderMain(); window.scrollTo(0, 0); }
  else if (act === 'book') { S.choosing = el.dataset.date + '|' + el.dataset.slot; S.armed = ''; renderMain(); }
  else if (act === 'bookwhere') book(el.dataset.date, el.dataset.slot, el.dataset.where);
  else if (act === 'bookback') { S.choosing = ''; renderMain(); }
  else if (act === 'cancel') cancel(el.dataset.date, el.dataset.slot);
  else if (act === 'copy') { const s = S.data.scripts[Number(el.dataset.i)]; if (s) copyText(s.caption); }
  else if (act === 'copyscript') { const s = S.data.scripts[Number(el.dataset.i)]; if (s) copyText(teleprompterText(s), 'Script'); }
  else if (act === 'readscript') { if (S.tab === 'team') S.viewer = ''; openScript(Number(el.dataset.i)); }
  else if (act === 'prompter') openPrompter(Number(el.dataset.i));
  else if (act === 'tpplay' || act === 'tptoggle') tpToggle();
  else if (act === 'tpclose') { const d = document.getElementById('prompter'); if (d) d.close(); }
  else if (act === 'tprestart') { const e2 = tpEls(); tpStop(); if (e2) { e2.stage.scrollTop = 0; TP.pos = 0; tpApply(); } }
  else if (act === 'tpspeed') tpSpeed(Number(el.dataset.d));
  else if (act === 'tpsize') tpSize(Number(el.dataset.d));
  else if (act === 'tpmirror') { TP.mirror = !TP.mirror; tpSave(); tpApply(); }
  else if (act === 'filmed') toggleFilmed(Number(el.dataset.i));
  else if (act === 'fb') {
    const i = Number(el.dataset.i), s = S.data.scripts[i], st = el.dataset.status;
    if (!s) return;
    const mine = fbList(s).find((f) => f.email === S.me.email);
    if (st === 'happy') { S.fbEdit = null; sendFeedback(i, mine && mine.status === 'happy' ? '' : 'happy', ''); }
    else {
      S.fbEdit = { key: s.key, status: st, note: (S.fbEdit && S.fbEdit.key === s.key ? S.fbEdit.note : (mine ? mine.note : '')) || '' };
      const inPop = !!el.closest('dialog');
      renderMain(); refreshPop();
      const scope = inPop ? document.getElementById('scriptpop') : document.getElementById('main');
      const ta = scope && scope.querySelector(`.fbnote[data-fbnote="${CSS.escape(s.key)}"]`);
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    }
  }
  else if (act === 'fbsend') {
    const i = Number(el.dataset.i), ed = S.fbEdit;
    if (!ed) return;
    if (ed.status === 'changes' && !ed.note.trim()) { toast('Add a note so Zach knows what to change', true); const ta = (el.closest('.fb') || document).querySelector('.fbnote'); if (ta) ta.focus(); return; }
    sendFeedback(i, ed.status, ed.note);
  }
  else if (act === 'fbcancel') { S.fbEdit = null; renderMain(); refreshPop(); }
  else if (act === 'fbclear') { S.fbEdit = null; sendFeedback(Number(el.dataset.i), '', ''); }
  else if (act === 'gobook') {
    if (S.me.isAdmin && el.dataset.who) { const em = emailOf(el.dataset.who); if (em) { S.bookAs = em; store.set('fth.bookAs', em); } }
    S.tab = 'calendar'; store.set('fth.tab', S.tab); renderBar(); renderMain(); window.scrollTo(0, 0);
  }
  else if (act === 'closescript') { const d = document.getElementById('scriptpop'); if (d) d.close(); }
  else if (act === 'refresh') loadWeek(true);
  else if (act === 'thisweek') setWeek(S.boot.currentWeek);
  else if (act === 'removeweek') setWeekHidden(true, el.dataset.week);
  else if (act === 'restoreweek') setWeekHidden(false, el.dataset.week);
  else if (act === 'reload') loadWeek(false);
  else if (act === 'signout') { if (S.realMe) { S.me = S.realMe; S.boot = S.realBoot; S.realMe = null; renderPvBar(); } store.set('fth.token', null); S.token = ''; S.data = null; signinForm(''); }
  else if (act === 'signin-back') { store.set('fth.codeAt', null); signinForm(''); }
  else if (act === 'signin-have') {
    const em = ($('#email') && $('#email').value.trim().toLowerCase()) || '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) signinNote('Enter your email first, then use the code from your email.');
    else { store.set('fth.email', em); signinForm('', 'code', em); }
  }
  else if (act === 'restart') { $('#main').innerHTML = '<div class="loading"><span class="spinner"></span>Loading</div>'; start(); }
});
window.addEventListener('popstate', () => {
  if (S.selfBack) { S.selfBack = false; return; }
  const lvl = (history.state && history.state.pop) || 0;
  ['prompter', 'scriptpop', 'pvpick'].forEach((id) => { const d = document.getElementById(id); if (d && d.open && (d._lvl || 0) > lvl) d.close(); });
});
document.addEventListener('input', (e) => {
  if (e.target && e.target.dataset && e.target.dataset.fbnote !== undefined && S.fbEdit && S.fbEdit.key === e.target.dataset.fbnote) { S.fbEdit.note = e.target.value; return; }
  if (!S.remind || !e.target) return;
  if (e.target.id === 'remind-subject') { S.remind.subject = e.target.value; S.remind.edited = true; }
  if (e.target.id === 'remind-message') { S.remind.message = e.target.value; S.remind.edited = true; }
});
document.addEventListener('change', (e) => {
  if (S.remind && e.target && e.target.dataset && e.target.dataset.remind) {
    S.remind.to[e.target.dataset.remind] = e.target.checked;
    if (S.armed === 'remind') S.armed = '';
    renderMain();
    return;
  }
  if (e.target && e.target.id === 'bookas') { S.bookAs = e.target.value; store.set('fth.bookAs', S.bookAs); }
});

start();
</script>
</body>
</html>
